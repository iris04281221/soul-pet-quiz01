<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>靈魂寵物測驗｜測出最適合你個性的毛孩夥伴</title>
<style>
:root{
  --bg:#faf5ea; --card:#fffdf8; --ink:#4a3f35; --muted:#8a7b6c;
  --accent:#e8a87c; --accent-d:#d68a58; --line:#eadfcc; --soft:#f6e9d3;
  --shadow:0 10px 30px rgba(120,90,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 15% 10%,#fff3d9 0,transparent 40%),
                   radial-gradient(circle at 90% 90%,#fde4d0 0,transparent 35%);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:20px;line-height:1.7;
}
#app{width:100%;max-width:560px;position:relative}
.screen{
  background:var(--card);border-radius:28px;box-shadow:var(--shadow);
  border:2px solid var(--line);padding:36px 28px;text-align:center;
  display:none;
}
.screen.active{display:block;animation:slideIn .5s cubic-bezier(.22,1,.36,1)}
.screen.leaving{display:block;animation:slideOut .35s ease forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(-40px)}}

.emoji-row{font-size:2.2rem;letter-spacing:.4rem;margin-bottom:12px}
.tag{display:inline-block;background:var(--soft);color:var(--accent-d);
  padding:4px 14px;border-radius:99px;font-size:.85rem;margin-bottom:14px;letter-spacing:.1em}
h1{font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.35;margin-bottom:14px}
.sub{color:var(--muted);margin-bottom:28px;font-size:1rem}

button{font-family:inherit;cursor:pointer;border:none;transition:transform .15s ease,box-shadow .2s,background .2s}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid #f2c9a6;outline-offset:3px}
.btn{
  background:var(--accent);color:#fff;font-size:1.1rem;font-weight:700;
  padding:14px 38px;border-radius:99px;box-shadow:0 6px 16px rgba(214,138,88,.35);
}
.btn:hover{background:var(--accent-d);transform:scale(1.04)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none;font-size:1rem;padding:12px 26px}
.btn.ghost:hover{background:#f0dcbb}

/* progress */
.progress-meta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f3c58f,var(--accent));
  border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}

.q-title{font-size:clamp(1.1rem,4.4vw,1.3rem);margin-bottom:6px}
.q-scene{color:var(--accent-d);font-size:.85rem;letter-spacing:.1em;margin-bottom:6px}
.options{display:flex;flex-direction:column;gap:12px;margin-top:20px;text-align:left}
.opt{
  background:#fff;border:2px solid var(--line);border-radius:20px;
  padding:14px 18px;font-size:1rem;color:var(--ink);text-align:left;
  display:flex;gap:12px;align-items:flex-start;line-height:1.6;
}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);
  color:var(--accent-d);display:grid;place-items:center;font-size:.9rem}
.opt:hover{border-color:var(--accent);transform:scale(1.02)}
.opt:active{transform:scale(.96)}
.opt.picked{background:var(--soft);border-color:var(--accent)}
.opt.picked b{background:var(--accent);color:#fff}
.opt:disabled{pointer-events:none}

/* loading */
.loader{font-size:3rem;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-12px) scale(1.1)}}
.loading-text{margin-top:14px;color:var(--muted)}

/* result */
.pet-emoji{font-size:5rem;line-height:1.2;animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.pet-name{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:900;letter-spacing:.1em;margin:4px 0}
.pet-title{font-size:clamp(1.15rem,4.6vw,1.4rem);color:var(--accent-d);font-weight:700;margin-bottom:12px}
.pet-quote{display:inline-block;background:var(--soft);padding:6px 18px;border-radius:99px;
  font-size:.95rem;margin-bottom:18px}
.pet-desc{color:var(--ink);text-align:left;background:#fffaf0;border:2px dashed var(--line);
  padding:16px 18px;border-radius:20px;margin-bottom:24px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);
  color:#fff;padding:10px 22px;border-radius:99px;opacity:0;pointer-events:none;
  transition:.3s;font-size:.95rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:480px){
  .screen{padding:28px 18px;border-radius:24px}
  .btn{width:100%}
  .actions .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main id="app">

  <section class="screen active" id="cover" aria-labelledby="coverTitle">
    <div class="emoji-row" aria-hidden="true">🐶🐱🐹</div>
    <span class="tag">靈魂寵物測驗</span>
    <h1 id="coverTitle">探索你的專屬毛孩頻率</h1>
    <p class="sub">透過五道生活情境小測驗，找出與你性格最契合的毛孩夥伴。</p>
    <button class="btn" id="startBtn">開始測驗</button>
  </section>

  <section class="screen" id="quiz" aria-live="polite">
    <div class="progress-meta"><span id="qNum">第 1 / 5 題</span><span id="qPct">0%</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="barFill"></i></div>
    <div class="q-scene" id="qScene"></div>
    <h2 class="q-title" id="qTitle"></h2>
    <div class="options" id="options"></div>
  </section>

  <section class="screen" id="loading">
    <div class="loader" aria-hidden="true">🐾</div>
    <p class="loading-text">正在比對你的靈魂頻率…</p>
  </section>

  <section class="screen" id="result" aria-live="polite">
    <div class="pet-emoji" id="rEmoji" aria-hidden="true"></div>
    <div class="pet-name" id="rName"></div>
    <div class="pet-title" id="rTitle"></div>
    <div class="pet-quote" id="rQuote"></div>
    <p class="pet-desc" id="rDesc"></p>
    <div class="actions">
      <button class="btn ghost" id="retryBtn">重新測驗</button>
      <button class="btn" id="copyBtn">複製結果連結</button>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const QUESTIONS = [
  {scene:"假日時光", q:"終於迎來不用鬧鐘的週末，你最理想的早晨展開方式是？",
   o:["背上小背包出門探索沒去過的街巷或公園，享受陽光","沖杯咖啡窩在窗邊曬太陽看書，互不打擾就感到平靜","拉上窗簾在溫暖被窩裡追劇或拼圖，享受專屬的私密小角落"]},
  {scene:"人際社交", q:"受邀參加一個有認識也有新朋友的聚會，你的社交模式通常是？",
   o:["主動開展話題、炒熱氣氛，喜歡認識新面孔帶來的熱鬧感","坐在邊緣觀察全局，只跟頻率合得來的幾個人深入淺談","只想在角落專心吃點心，默默觀察大家的一舉一動，隨時想提早離場"]},
  {scene:"面對壓力", q:"結束了高壓疲憊的一天，回到家後你最渴望哪種陪伴？",
   o:["有人熱情迎接並聽我宣洩傾訴，一起吃頓大餐轉移心情","各自待在同一個空間做喜歡的事，安靜存在就是最好的支持","完全獨處，戴上耳機沉浸在自己的小天地裡慢慢充電"]},
  {scene:"生活空間", q:"如果可以自由設計你的生活環境，你最在意哪種特質？",
   o:["寬敞通透且動線流暢，隨時有足夠空間走動與活動","注重質感與層次，有挑高的層架、舒服的沙發與乾淨的邊角","包裹感強烈的溫馨小空間，東西收納整齊、充滿安全感"]},
  {scene:"旅行探索", q:"安排一場短暫的充電旅行，你直覺會選擇哪種行程？",
   o:["行程豐富、四處拍照踩點的戶外探險之旅","挑一間質感民宿住下，隨心所欲散步漫遊的無計畫假期","租個靜謐的小木屋，帶齊自己喜歡的物品足不出戶度過兩天"]}
];
const LETTERS = ["A","B","C"];
// 背後計分：A=狗、B=貓、C=倉鼠
const TYPES = ["dog","cat","hamster"];
const RESULTS = {
  dog:{emoji:"🐶",name:"狗",title:"陽光奔放的快樂夥伴",quote:"「出門玩吧，今天也要閃閃發亮！」",
    desc:"你的熱情直接而真誠，能自然地感染身邊的每個人。你喜歡戶外、樂於主動陪伴，也總是把快樂分享出去。忠誠又開朗的狗狗，就是你最棒的生活玩伴。"},
  cat:{emoji:"🐱",name:"貓",title:"優雅獨立的靈魂共鳴者",quote:"「靠得剛剛好，才是最舒服的距離。」",
    desc:"你懂得與自己相處，也珍惜彼此之間細膩的邊界感。你擅長觀察，只把真心留給頻率相合的人。貓咪那種若即若離卻深情自在的姿態，與你最合拍。"},
  hamster:{emoji:"🐹",name:"倉鼠",title:"沉靜細膩的安全感構築家",quote:"「小小的角落，就是我的大宇宙。」",
    desc:"你熱愛屬於自己的小天地，也重視內在的秩序與安心感。你認真過著每一天的小日子。小巧安靜、認真生活的倉鼠，會是你療癒心靈的最佳同伴。"}
};

const $ = id => document.getElementById(id);
const screens = ["cover","quiz","loading","result"].map($);
let current = 0, answers = [], locked = false;

function show(id){
  const next = $(id), prev = screens.find(s=>s.classList.contains("active"));
  if(prev === next) return;
  if(prev){
    prev.classList.add("leaving");
    setTimeout(()=>{prev.classList.remove("active","leaving");next.classList.add("active")},320);
  } else next.classList.add("active");
}

function renderQuestion(){
  const d = QUESTIONS[current];
  $("qNum").textContent = `第 ${current+1} / ${QUESTIONS.length} 題`;
  const pct = Math.round(current/QUESTIONS.length*100);
  $("qPct").textContent = pct + "%";
  $("barFill").style.width = pct + "%";
  $("barWrap").setAttribute("aria-valuenow", pct);
  $("qScene").textContent = `Q${current+1}・${d.scene}`;
  $("qTitle").textContent = d.q;
  const box = $("options"); box.innerHTML = "";
  d.o.forEach((text,i)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    const l = document.createElement("b"); l.textContent = LETTERS[i];
    const s = document.createElement("span"); s.textContent = text;
    b.append(l,s);
    b.addEventListener("click",()=>choose(i,b));
    box.appendChild(b);
  });
  box.animate([{opacity:0,transform:"translateX(30px)"},{opacity:1,transform:"none"}],{duration:450,easing:"cubic-bezier(.22,1,.36,1)"});
}

function choose(i,btn){
  if(locked) return;
  locked = true;
  btn.classList.add("picked");
  answers[current] = i;
  const pct = Math.round((current+1)/QUESTIONS.length*100);
  $("barFill").style.width = pct + "%";
  $("qPct").textContent = pct + "%";
  $("barWrap").setAttribute("aria-valuenow", pct);
  setTimeout(()=>{
    locked = false;
    if(current < QUESTIONS.length-1){ current++; renderQuestion(); }
    else finish();
  },380);
}

function calcResult(){
  const score = [0,0,0];
  answers.forEach(a=>score[a]++);
  const max = Math.max(...score);
  const tied = [0,1,2].filter(i=>score[i]===max);
  if(tied.length === 1) return TYPES[tied[0]];
  // 同分：優先以第五題選項決定；若第五題選項不在同分者中，依序回看第四題、第三題…
  for(let q=answers.length-1;q>=0;q--){
    if(tied.includes(answers[q])) return TYPES[answers[q]];
  }
  return TYPES[tied[0]];
}

function finish(){
  const type = calcResult();
  show("loading");
  setTimeout(()=>showResult(type,true),1300);
}

function showResult(type,push){
  const r = RESULTS[type];
  $("rEmoji").textContent = r.emoji;
  $("rName").textContent = r.name;
  $("rTitle").textContent = r.title;
  $("rQuote").textContent = r.quote;
  $("rDesc").textContent = r.desc;
  if(push) history.replaceState(null,"","#result=" + type);
  show("result");
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("show"),2000);
}

$("startBtn").addEventListener("click",()=>{
  current = 0; answers = []; renderQuestion(); show("quiz");
});
$("retryBtn").addEventListener("click",()=>{
  history.replaceState(null,"",location.pathname + location.search);
  current = 0; answers = []; show("cover");
});
$("copyBtn").addEventListener("click",async()=>{
  const url = location.href;
  try{
    await navigator.clipboard.writeText(url);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = url; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy")}catch(_){}
    ta.remove();
  }
  toast("結果連結已複製 🐾");
});

// 開啟分享連結時直接顯示結果
const m = location.hash.match(/^#result=(dog|cat|hamster)$/);
if(m) showResult(m[1],false);
</script>
</body>
</html>
